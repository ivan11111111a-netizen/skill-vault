name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # pinned: newer Ubuntu images may not ship Python 3.9, the README's minimum
        os: [ubuntu-24.04, windows-latest]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: The audit finds every rule on the fixture
        run: python scripts/selftest.py
      - name: The index matches vault/
        run: python scripts/build_index.py --check
